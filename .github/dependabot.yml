version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      api-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /engine
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
