name: sms-gateway

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: sms_gateway
      POSTGRES_USER: sms_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro   # runs 001..003 on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_owner -d sms_gateway"]
      interval: 5s
      retries: 10
    networks: [data]

  redis:
    image: redis:7.4-alpine
    # AOF fsync every second: at most ~1s of balance debits at risk on a crash;
    # noeviction so balance / txn keys are never silently dropped.
    command: >
      redis-server --appendonly yes --appendfsync everysec
                   --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [data]

networks:
  data:
    internal: true

volumes:
  pg_data:
  redis_data:
