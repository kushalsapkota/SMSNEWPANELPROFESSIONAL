# deploy/nginx.conf: example TLS front end for the SMS gateway.
#
# Layout assumed (adjust names / certs):
#   https://panel.example.com  → web :3001 (the panel; it also proxies /api/* and /v1/* to the api)
#   https://api.example.com    → api :3000 (public HTTP API for clients: /v1/*, plus /api/*)
#   smpp.example.com:2775      → engine :2775 (raw SMPP over TCP, stream block below)
#   smpp.example.com:3775      → the same engine port, with TLS terminated by nginx (optional)
#
# With compose on the same host, keep PUBLISH_ADDR=127.0.0.1 (the default) so 3000/3001 are only
# reachable through nginx, and TRUST_PROXY=1 so the api takes the client IP from X-Forwarded-For
# (IP whitelists depend on it). nginx below REPLACES X-Forwarded-For with $remote_addr. It does not
# append to it, and the api only believes the header from TRUSTED_PROXIES peers, using the
# right-most hop that is not a trusted proxy, so clients cannot spoof their address.
#
# Access logs never contain API keys: the legacy `GET /v1/sms/send?api_key=...` form would put
# the live key in "$request", so any request whose query string carries api_key is logged with
# the query string replaced by "[redacted]" ($request_log below).
#
# Install: copy to /etc/nginx/nginx.conf (or split the http/stream parts into conf.d / a stream
# include), then `nginx -t && systemctl reload nginx`. Certificates: certbot / acme.sh.
# The stream block needs the stream module (Debian/Ubuntu: libnginx-mod-stream).

user www-data;
worker_processes auto;
worker_rlimit_nofile 65536;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 16384;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;
    keepalive_timeout 65s;

    # $request with the query string redacted when it carries an API key (case-insensitive, and
    # percent-encoded spellings of api_key too: the api's query parser decodes parameter names).
    map $request $request_log {
        "~*^(?<rl_method>\S+)\s+(?<rl_path>[^?\s]*)\?\S*api(?:_|%5f)key\S*(?<rl_proto>\s+\S+)?\s*$" "$rl_method $rl_path?[redacted]$rl_proto";
        "~*api(?:_|%5f)key" "[redacted request line]";
        default $request;
    }

    log_format main '$remote_addr - [$time_iso8601] "$request_log" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Campaign CSV uploads go up to 25 MB (api). JSON bodies are capped at 2 MB by the api.
    client_max_body_size 26m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Defence in depth on top of the api's per-key limit (100 req/s per API key).
    limit_req_zone $binary_remote_addr zone=public_api:20m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    upstream smsgw_web {
        server 127.0.0.1:3001;
        keepalive 32;
    }
    upstream smsgw_api {
        server 127.0.0.1:3000;
        # Several api replicas: add more `server` lines (the api is stateless).
        keepalive 64;
    }

    # Shared proxy settings.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;   # CSV exports stream; keep this generous
    proxy_send_timeout    120s;

    # HTTP → HTTPS, plus ACME challenges.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/acme; }
        location / { return 301 https://$host$request_uri; }
    }

    # Panel (web). The web server rewrites /api/* and /v1/* to the api itself; routing them
    # straight to the api here saves a hop and keeps streaming exports unbuffered.
    server {
        # nginx >= 1.25.1: prefer `listen 443 ssl;` + `http2 on;` (the form below still works there).
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name panel.example.com;

        ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location = /api/auth/login {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://smsgw_api;
        }
        location /api/messages/export {
            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_pass http://smsgw_api;
        }
        location /api/ {
            proxy_pass http://smsgw_api;
        }
        location /v1/ {
            limit_req zone=public_api burst=400 nodelay;
            proxy_pass http://smsgw_api;
        }
        location /_next/static/ {
            proxy_pass http://smsgw_web;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }
        location / {
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://smsgw_web;
        }
    }

    # Public HTTP API for clients.
    server {
        # nginx >= 1.25.1: prefer `listen 443 ssl;` + `http2 on;` (the form below still works there).
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.example.com;

        ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location /v1/ {
            limit_req zone=public_api burst=400 nodelay;
            proxy_pass http://smsgw_api;
        }
        location = /api/auth/login {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://smsgw_api;
        }
        location /api/ {
            proxy_buffering off;
            proxy_pass http://smsgw_api;
        }
        location / {
            return 404;
        }
    }
}

# SMPP is raw TCP, not HTTP: it needs a `stream` block (top level, outside `http`). nginx owns
# public port 2775 here, so publish the engine on another loopback port to avoid a bind clash:
# SMPP_PUBLISH_ADDR=127.0.0.1 and SMPP_PUBLIC_PORT=12775 in deploy/.env (the upstream below). Or
# skip this block and publish 2775 directly (the default SMPP_PUBLISH_ADDR=0.0.0.0) with a host
# firewall allow-list.
#
# Client IPs: the engine sees nginx's address unless you use PROXY protocol, and the engine does not
# parse PROXY protocol. SMPP IP whitelists (ip_whitelists scope SMPP/ALL) need the real peer
# address, so for SMPP prefer publishing 2775 directly (SMPP_PUBLISH_ADDR=0.0.0.0, the default) or
# use `proxy_bind $remote_addr transparent;` with the TPROXY routing setup it requires.
stream {
    log_format smpp '$remote_addr [$time_iso8601] $protocol $status $bytes_sent $bytes_received $session_time';
    access_log /var/log/nginx/smpp.log smpp;

    upstream smsgw_smpp {
        server 127.0.0.1:12775;   # = SMPP_PUBLIC_PORT on SMPP_PUBLISH_ADDR=127.0.0.1
    }

    # Plain SMPP. Sessions are long-lived: enquire_link every ~30-60s keeps them open, and the
    # engine drops idle binds after ENGINE_SMPP_IDLE_TIMEOUT (90s).
    server {
        listen 2775 reuseport;
        proxy_pass smsgw_smpp;
        proxy_connect_timeout 5s;
        proxy_timeout 10m;
        tcp_nodelay on;
    }

    # SMPP over TLS (port 3775 is a common convention), terminated here.
    server {
        listen 3775 ssl reuseport;
        ssl_certificate     /etc/letsencrypt/live/smpp.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/smpp.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_pass smsgw_smpp;
        proxy_connect_timeout 5s;
        proxy_timeout 10m;
        tcp_nodelay on;
    }
}
