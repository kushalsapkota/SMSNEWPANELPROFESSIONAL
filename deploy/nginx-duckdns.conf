# SMS gateway panel + API over HTTPS for a DuckDNS (or any) domain.
# Domain: nepalotp.duckdns.org  (change DOMAIN in all three places below to reuse).
# TLS via Let's Encrypt; HTTP-01 renewal served from the /var/www/certbot webroot.
limit_req_zone $binary_remote_addr zone=smsgw_public_api:20m rate=200r/s;
limit_req_zone $binary_remote_addr zone=smsgw_auth:10m rate=10r/m;

upstream smsgw_web { server 127.0.0.1:3001; keepalive 32; }
upstream smsgw_api { server 127.0.0.1:3000; keepalive 64; }

# ---- Port 80: ACME challenge + redirect everything else to HTTPS ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # Let's Encrypt HTTP-01 (webroot) — must stay reachable for auto-renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / { return 301 https://nepalotp.duckdns.org$request_uri; }
}

# ---- Port 443: the panel + API ---------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name nepalotp.duckdns.org;
    server_tokens off;
    client_max_body_size 26m;

    ssl_certificate     /etc/letsencrypt/live/nepalotp.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nepalotp.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (defense-in-depth; the panel is a Next.js app so inline script/style are allowed).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;   # replace, never append: whitelists trust this
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;

    location = /api/auth/login {
        limit_req zone=smsgw_auth burst=20 nodelay;
        proxy_pass http://smsgw_api;
    }
    location /api/messages/export {
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_pass http://smsgw_api;
    }
    # API docs (Swagger UI + OpenAPI JSON) are never exposed to the public edge.
    location /api/docs { return 404; }
    location /api/ { proxy_pass http://smsgw_api; }
    location /v1/ {
        limit_req zone=smsgw_public_api burst=400 nodelay;
        proxy_pass http://smsgw_api;
    }
    location /_next/static/ {
        proxy_pass http://smsgw_web;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location / { proxy_pass http://smsgw_web; }
}
