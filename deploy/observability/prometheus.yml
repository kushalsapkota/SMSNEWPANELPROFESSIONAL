global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The engine exposes Prometheus metrics on :9100 (internal, backend network).
  - job_name: sms-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["engine:9100"]

  # Optional, once added to the stack (see deploy/observability/README.md):
  # - job_name: postgres
  #   static_configs: [{ targets: ["postgres-exporter:9187"] }]
  # - job_name: redis
  #   static_configs: [{ targets: ["redis-exporter:9121"] }]
