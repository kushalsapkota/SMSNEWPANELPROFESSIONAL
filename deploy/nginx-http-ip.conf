# SMS gateway panel + API over plain HTTP on the server IP (no domain yet).
# Switch to deploy/nginx.conf's HTTPS servers once a domain points here.
limit_req_zone $binary_remote_addr zone=smsgw_public_api:20m rate=200r/s;
limit_req_zone $binary_remote_addr zone=smsgw_auth:10m rate=10r/m;

upstream smsgw_web { server 127.0.0.1:3001; keepalive 32; }
upstream smsgw_api { server 127.0.0.1:3000; keepalive 64; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 26m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;   # replace, never append: whitelists trust this
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;

    location = /api/auth/login {
        limit_req zone=smsgw_auth burst=20 nodelay;
        proxy_pass http://smsgw_api;
    }
    location /api/messages/export {
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_pass http://smsgw_api;
    }
    location /api/ { proxy_pass http://smsgw_api; }
    location /v1/ {
        limit_req zone=smsgw_public_api burst=400 nodelay;
        proxy_pass http://smsgw_api;
    }
    location /_next/static/ {
        proxy_pass http://smsgw_web;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location / { proxy_pass http://smsgw_web; }
}
